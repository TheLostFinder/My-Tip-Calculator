<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tip Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>Not My Tip Calculator</h1>

    <label for="bill">Enter Bill Amount (Rs.)</label>
    <input type="number" id="bill" placeholder="e.g. 1000" />
    <p class="error" id="bill-error"></p>

    <label for="tip">Enter Tip Percentage (%)</label>
    <input type="number" id="tip" placeholder="e.g. 15" />
    <p class="error" id="tip-error"></p>

    <label for="people">Enter No. of People</label>
    <input type="number" id="people" placeholder="e.g. 2" value="1" />
    <p class="error" id="people-error"></p>

    <hr />

    <div class="result-row">
      <span>Resulting Tip Amount</span>
      <span id="out-tip">Rs. 0.00</span>
    </div>
    <div class="result-row">
      <span>Total Bill</span>
      <span id="out-total">Rs. 0.00</span>
    </div>
    <div class="result-row person">
      <span>Amount Per Person</span>
      <span id="out-per-person">Rs. 0.00</span>
    </div>

    <button onclick="resetAll()">Reset</button>
  </div>

  <script src="app.js"></script>

</body>
</html>
